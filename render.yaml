services:
  - type: web
    name: wwsc-demo
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WWSC_DB_PATH
        value: /var/data/wwsc.db
    disks:
      - name: wwsc-data
        mountPath: /var/data
        sizeGB: 1
